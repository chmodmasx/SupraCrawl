name: Phase 3C Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install baseline runtime and tests
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Full Python suite without vector extras
        run: pytest -q

  real-vector-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install local vector runtime
        run: pip install -e '.[dev,hybrid-eval]'
      - name: Full Python suite with vector extras
        run: pytest -q
      - name: Start OpenSearch
        run: docker compose up -d opensearch
      - name: Wait for OpenSearch
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "OpenSearch did not become healthy" >&2
          exit 1
      - name: Run Phase 3C real vector benchmark
        env:
          SUPRACRAWL_OPENSEARCH_URL: http://127.0.0.1:9200
        run: python verification/verify_real_vector_retrieval.py
      - name: Container state
        if: always()
        run: docker compose ps -a
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=400 opensearch
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
