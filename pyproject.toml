[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supracrawl"
version = "0.2.0"
description = "Self-hosted web retrieval and extraction backend optimized for LLM agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "orjson>=3.10",
  "pydantic-settings>=2.5",
  "redis>=5.0",
  "selectolax>=0.3.21",
  "trafilatura>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]
hybrid = [
  "fastembed>=0.6,<1",
  "numpy>=1.26,<3",
]
hybrid-eval = [
  "fastembed>=0.6,<1",
  "numpy>=1.26,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supracrawl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
