name: Phase 3D Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install baseline runtime and tests
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Full Python suite without hybrid extras
        run: pytest -q

  hybrid-runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production hybrid runtime and tests
        run: pip install -e '.[dev,hybrid]'
      - name: Full Python suite with hybrid runtime
        run: pytest -q

  hermes-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout SupraCrawl
        uses: actions/checkout@v7
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: 42ac29eacc4d743ed2df7db0f886b99111d9e68b
          path: hermes-agent
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install SupraCrawl test dependencies
        run: pip install -e '.[dev]'
      - name: Test against real Hermes WebSearchProvider ABC
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent:${{ github.workspace }}
        run: pytest -q verification/test_hermes_provider_contract.py

  live-hybrid-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install host verification runtime
        run: pip install -e '.[dev,hybrid]'
      - name: Build and start real hybrid-capable stack
        env:
          SUPRACRAWL_DENSE_ENABLED: "true"
          SUPRACRAWL_SEARCH_MODE: bm25
        run: docker compose up -d --build
      - name: Wait for API and OpenSearch
        run: |
          for attempt in $(seq 1 90); do
            api_ok=0
            os_ok=0
            curl -fsS http://127.0.0.1:8080/v1/health >/dev/null && api_ok=1 || true
            curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null && os_ok=1 || true
            if [ "$api_ok" -eq 1 ] && [ "$os_ok" -eq 1 ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Phase 3D stack did not become healthy" >&2
          exit 1
      - name: Verify standard API image contains local hybrid runtime
        run: docker compose exec -T api python -c "import fastembed; print(fastembed.__version__)"
      - name: Run real hybrid API verification
        env:
          SUPRACRAWL_API_URL: http://127.0.0.1:8080
          SUPRACRAWL_OPENSEARCH_URL: http://127.0.0.1:9200
        run: python verification/verify_phase3d_hybrid.py
      - name: Verify production indexing and physical stale-vector guard
        env:
          SUPRACRAWL_API_URL: http://127.0.0.1:8080
          SUPRACRAWL_OPENSEARCH_URL: http://127.0.0.1:9200
        run: python verification/verify_phase3d_indexing.py
      - name: Run live vector and lexical fault matrix
        env:
          SUPRACRAWL_API_URL: http://127.0.0.1:8080
          SUPRACRAWL_OPENSEARCH_URL: http://127.0.0.1:9200
        run: python verification/verify_phase3d_faults.py
      - name: Restart API with dense capability disabled
        env:
          SUPRACRAWL_DENSE_ENABLED: "false"
          SUPRACRAWL_SEARCH_MODE: bm25
        run: |
          docker compose stop api
          docker compose up -d api
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Dense-disabled API did not become healthy" >&2
          exit 1
      - name: Verify explicit hybrid degrades when dense is disabled
        env:
          PHASE3D_DENSE_DISABLED_ONLY: "1"
          SUPRACRAWL_API_URL: http://127.0.0.1:8080
          SUPRACRAWL_OPENSEARCH_URL: http://127.0.0.1:9200
        run: python verification/verify_phase3d_faults.py
      - name: Container state
        if: always()
        run: docker compose ps -a
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=500
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
