name: Phase 2 Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Full Python suite
        run: pytest -q

  hermes-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SupraCrawl
        uses: actions/checkout@v7
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: 42ac29eacc4d743ed2df7db0f886b99111d9e68b
          path: hermes-agent
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install SupraCrawl test dependencies
        run: pip install -e '.[dev]'
      - name: Test search and extract against real Hermes ABC
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent:${{ github.workspace }}
        run: pytest -q verification/test_hermes_provider_contract.py

  live-search-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and start complete stack
        run: docker compose up -d --build
      - name: Run Phase 2 live acceptance matrix
        run: python3 verification/verify_search_live.py
      - name: Container state
        if: always()
        run: docker compose ps -a
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=400
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
