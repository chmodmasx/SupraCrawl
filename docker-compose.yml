services:
  api:
    build: .
    container_name: supracrawl-api
    environment:
      SUPRACRAWL_EXTRACTOR_WORKER_URL: http://extractor-worker:3000
      SUPRACRAWL_REDIS_URL: redis://redis:6379/0
      SUPRACRAWL_OPENSEARCH_URL: http://opensearch:9200
      SUPRACRAWL_BROWSER_ENABLED: "true"
      SUPRACRAWL_OBEY_ROBOTS_TXT: "true"
      SUPRACRAWL_DENSE_ENABLED: "${SUPRACRAWL_DENSE_ENABLED:-true}"
      SUPRACRAWL_SEARCH_MODE: "${SUPRACRAWL_SEARCH_MODE:-hybrid}"
      SUPRACRAWL_DENSE_DIMENSION: "${SUPRACRAWL_DENSE_DIMENSION:-384}"
    ports:
      - "8080:8080"
    depends_on:
      extractor-worker:
        condition: service_started
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  extractor-worker:
    build: ./services/extractor-worker
    container_name: supracrawl-extractor
    environment:
      BROWSER_ENABLED: "true"
      PORT: "3000"
    shm_size: "512mb"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: supracrawl-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: supracrawl-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  opensearch-data:
