name: Phase 3F Evaluation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-hybrid-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install evaluation runtime
        run: pip install -e '.[dev,hybrid]' 'fastembed==0.8.0'
      - name: Ruff
        run: ruff check .
      - name: Python regression suite
        run: pytest -q
      - name: Build and start certified default stack
        run: docker compose up -d --build
      - name: Wait for API and OpenSearch
        run: |
          for attempt in $(seq 1 90); do
            api_ok=0
            os_ok=0
            curl -fsS http://127.0.0.1:8080/v1/health >/dev/null && api_ok=1 || true
            curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null && os_ok=1 || true
            if [ "$api_ok" -eq 1 ] && [ "$os_ok" -eq 1 ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Phase 3F baseline stack did not become healthy" >&2
          exit 1
      - name: Verify certified hybrid defaults
        run: |
          test "$(docker compose exec -T api printenv SUPRACRAWL_SEARCH_MODE | tr -d '\r')" = "hybrid"
          test "$(docker compose exec -T api printenv SUPRACRAWL_DENSE_ENABLED | tr -d '\r')" = "true"
      - name: Measure frozen hybrid baseline
        env:
          SUPRACRAWL_API_URL: http://127.0.0.1:8080
          SUPRACRAWL_OPENSEARCH_URL: http://127.0.0.1:9200
          PHASE3F_BASELINE_OUTPUT: phase3f-baseline.json
        run: python verification/verify_phase3f_baseline.py
      - name: Show baseline artifact
        if: always()
        run: |
          if [ -f phase3f-baseline.json ]; then
            cat phase3f-baseline.json
          fi
      - name: Upload baseline artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase3f-frozen-hybrid-baseline
          path: phase3f-baseline.json
          if-no-files-found: error
          retention-days: 14
      - name: Run preregistered candidate 1 reranker experiment
        env:
          SUPRACRAWL_API_URL: http://127.0.0.1:8080
          SUPRACRAWL_OPENSEARCH_URL: http://127.0.0.1:9200
          PHASE3F_CANDIDATE1_OUTPUT: phase3f-candidate1.json
        run: python verification/verify_phase3f_candidate1.py
      - name: Show candidate 1 artifact
        if: always()
        run: |
          if [ -f phase3f-candidate1.json ]; then
            cat phase3f-candidate1.json
          fi
      - name: Upload candidate 1 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase3f-candidate1-mmarco-minilmv2-qint8-avx2
          path: phase3f-candidate1.json
          if-no-files-found: error
          retention-days: 14
      - name: Container state
        if: always()
        run: docker compose ps -a
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=600
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
