name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q

  extractor-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/extractor-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install
        run: npm install
      - name: Syntax check
        run: npm run check
      - name: Readability smoke test
        run: npm run smoke

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t supracrawl-api:ci .
      - name: Build extractor image
        run: docker build -t supracrawl-extractor:ci services/extractor-worker
      - name: API health smoke test
        run: |
          docker run -d --rm --name supracrawl-api-smoke \
            -e SUPRACRAWL_REDIS_URL= \
            -p 18080:8080 supracrawl-api:ci
          trap 'docker stop supracrawl-api-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs supracrawl-api-smoke
          exit 1
